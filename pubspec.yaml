name: zheeta
description: Zheeta... The Social Affiliate Networking Platform

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.4+2 # iOS version number
#version: 1.1.5+7 # Android version number

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  # UI Components & Animations
  cupertino_icons: ^1.0.8
  flutter_svg: any
  animations: ^2.0.11
  carousel_slider: ^5.0.0
  appinio_swiper: ^2.1.1
  dotted_border: ^2.1.0
  flutter_spinkit: any
  shimmer: ^3.0.0

  # Form Handling & Inputs
  intl_phone_field: ^3.2.0
  otp: ^3.1.4
  pin_code_fields: ^8.0.1

  # Media Handling
  image_picker: ^1.1.2

  # State Management & Dependency Injection
  flutter_bloc: any
  bloc: ^9.0.0
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Data & Caching
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.5
#  hive_flutter: ^1.1.0
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^4.0.0
  flutter_session_manager: ^1.0.3

  # Network & APIs
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  http: ^1.3.0
  jwt_decode: ^0.3.1

  # Geolocation & Maps
  geocoding: ^3.0.0
  geolocator: ^13.0.2

  # Security & Authentication
  flutter_secure_storage: ^9.2.4

  # Routing & Navigation
  auto_route: ^9.3.0+1

  # Code Generation & Annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Purchases & Payments
  in_app_purchase: ^3.2.1

  # Utilities
  intl: any
  age_calculator: ^1.0.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  share_plus: ^10.1.4
  firebase_messaging: ^15.1.6
  firebase_core: ^3.9.0
  flutter_local_notifications: ^18.0.1
  app_links: ^6.3.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  timeago: ^3.7.0
  mime: ^2.0.0
  app_settings: ^5.2.0
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.3
  build_runner: ^2.4.14
  injectable_generator: ^2.7.0
  freezed: ^2.5.7
  auto_route_generator: ^9.3.1
  mockito: ^5.4.5
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/json/
    - assets/images/
    - assets/images/icons/
    - assets/images/heroo.png

  fonts:
    - family: MuseoModerno
      fonts:
        - asset: assets/fonts/MuseoModerno-Black.ttf
        - asset: assets/fonts/MuseoModerno-Bold.ttf
        - asset: assets/fonts/MuseoModerno-ExtraBold.ttf
        - asset: assets/fonts/MuseoModerno-ExtraLight.ttf
        - asset: assets/fonts/MuseoModerno-Light.ttf
        - asset: assets/fonts/MuseoModerno-Medium.ttf
        - asset: assets/fonts/MuseoModerno-Regular.ttf
        - asset: assets/fonts/MuseoModerno-SemiBold.ttf
        - asset: assets/fonts/MuseoModerno-Thin.ttf

    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/static/Outfit-Black.ttf
        - asset: assets/fonts/Outfit/static/Outfit-Bold.ttf
        - asset: assets/fonts/Outfit/static/Outfit-ExtraBold.ttf
        - asset: assets/fonts/Outfit/static/Outfit-ExtraLight.ttf
        - asset: assets/fonts/Outfit/static/Outfit-Light.ttf
        - asset: assets/fonts/Outfit/static/Outfit-Medium.ttf
        - asset: assets/fonts/Outfit/static/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit/static/Outfit-SemiBold.ttf
        - asset: assets/fonts/Outfit/static/Outfit-Thin.ttf
